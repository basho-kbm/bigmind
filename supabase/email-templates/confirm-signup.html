<!doctype html>
<html lang="en">
  <body style="margin:0;background:#0c0a09;color:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px;">
      <div style="font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:#a7f3d0;">BigMind</div>
      <h1 style="margin:20px 0 12px;font-size:32px;line-height:1.15;">Confirm your email</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.7;color:#d6d3d1;">
        Tap below to confirm your email and open BigMind.
      </p>
      <p style="margin:0 0 28px;">
        <a
          href="https://knowbigmind.com/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app"
          style="display:inline-block;border-radius:999px;background:#34d399;color:#0c0a09;padding:14px 24px;font-size:16px;font-weight:600;text-decoration:none;"
        >
          Confirm email
        </a>
      </p>
      <p style="margin:0 0 12px;font-size:14px;line-height:1.7;color:#d6d3d1;">
        If the button does not work, copy and paste this link into your browser:
      </p>
      <p style="margin:0;font-size:14px;line-height:1.7;word-break:break-all;color:#a8a29e;">
        https://knowbigmind.com/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app
      </p>
    </div>
  </body>
</html>
